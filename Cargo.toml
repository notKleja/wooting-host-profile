[package]
name = "wooting-host-profile"
version = "0.5.0"
edition = "2024"
description = "Offline per-host profile selector for Wooting keyboards"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "6"
encoding_rs = "0.8"
fs2 = "0.4"
getrandom = "0.4"
rusty-leveldb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
wooting-rgb-sys = "0.3.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
opt-level = "s"
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
